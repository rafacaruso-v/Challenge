name: Security Pipeline (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run Semgrep
        run: pip install semgrep && semgrep scan --config auto --json --output semgrep.json --exclude-rule generic.nginx.security.missing-internal.missing-internal --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected --error
      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: aspm-semgrep
          path: semgrep.json
          if-no-files-found: ignore

      - name: Enforce gate (falha se houver achados)
        run: |
          total=$(jq '.results | length' semgrep.json)
          if [ "$total" -gt 0 ]; then
            echo "::error::Semgrep encontrou $total achado(s)."
            jq -r '.results[] | "- \(.check_id) em \(.path):\(.start.line)"' semgrep.json
            exit 1
          fi

      - name: Comment PR on SAST failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **SAST (Semgrep)** encontrou vulnerabilidades no código. Verifique o log do job antes de fazer merge.'
            })

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Gitleaks (SHA256 fixo)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      - name: Run Gitleaks
        run: |
          gitleaks git --no-banner --redact --report-format json --report-path gitleaks.json --exit-code 0 .

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: aspm-gitleaks
          path: gitleaks.json
          if-no-files-found: ignore

      - name: Enforce gate (falha se houver segredos)
        run: |
          total=$(jq 'length' gitleaks.json)
          if [ "$total" -gt 0 ]; then
            echo "::error::Gitleaks encontrou $total possível(is) segredo(s). Para ignorar um falso positivo, adicione o Fingerprint ao .gitleaksignore."
            jq -r '.[] | "- \(.RuleID) em \(.File):\(.StartLine) (Fingerprint: \(.Fingerprint))"' gitleaks.json
            exit 1
          fi

      - name: Comment PR on secrets failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Secrets Scan (Gitleaks)** detectou possíveis credenciais ou segredos expostos no código. Revise antes de fazer merge.'
            })

  pipeline-scan:
    name: Pipeline CI/CD Security (Zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Zizmor
        run: pip install zizmor

      - name: Run Zizmor
        run: |
          zizmor --format sarif .github/workflows/security.yml > zizmor-results.sarif || true

      - name: Upload Zizmor Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zizmor-report
          path: zizmor-results.sarif

  dependency-scan:
    name: Dependency Scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trivy scan (SCA)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'json'
          output: 'trivy.json'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: aspm-trivy
          path: trivy.json
          if-no-files-found: ignore

      - name: Enforce severity gate (falha se houver HIGH/CRITICAL)
        run: |
          filtro='.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")'
          total=$(jq "[$filtro] | length" trivy.json)
          if [ "$total" -gt 0 ]; then
            echo "::error::Trivy encontrou $total vulnerabilidade(s) HIGH/CRITICAL."
            jq -r "$filtro | \"- [\(.Severity)] \(.VulnerabilityID) em \(.PkgName) \(.InstalledVersion)\"" trivy.json
            exit 1
          fi

      - name: Comment PR on dependency failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Dependency Scan (Trivy SCA)** encontrou dependências com vulnerabilidades HIGH ou CRITICAL. Atualize os pacotes antes de fazer merge.'
            })

  sbom:
    name: SBOM (Trivy CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.json

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, dependency-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: docker build -t aspm-platform:${{ github.sha }} .

      - name: Generate SARIF report (não falha o build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'aspm-platform:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-results
          path: trivy-image.sarif

      - name: Enforce severity gate (falha se houver HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'image'
          image-ref: 'aspm-platform:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Comment PR on container failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Container Scan (Trivy)** encontrou vulnerabilidades HIGH ou CRITICAL na imagem Docker. Corrija antes de fazer merge.'
            })

  zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, pipeline-scan, dependency-scan, sbom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Start Streamlit App
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true &
          timeout 60s bash -c 'until curl -s http://localhost:8501; do sleep 5; done' || true

      - name: Start Nginx
        run: |
          docker run -d \
            --network host \
            -e STREAMLIT_HOST=localhost \
            -v ${{ github.workspace }}/proxy.conf:/etc/nginx/templates/default.conf.template:ro \
            --name nginx-proxy \
            nginx:alpine
          timeout 30s bash -c 'until curl -s http://localhost:80; do sleep 2; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:80"
          rules_file_name: ".zap/rules.tsv"
          issue_title: "Security Scan: OWASP ZAP Alerts Found"
          fail_action: true
          artifact_name: "zap-analysis-report"

      - name: Comment PR on DAST failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**DAST (OWASP ZAP)** detectou vulnerabilidades na aplicação em execução. Verifique o relatório ZAP antes de fazer merge.'
            })

  aspm-webhook:
    name: Enviar resultados à ASPM Platform
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, dependency-scan]
    if: always() && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Download scanner reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: aspm-*
          merge-multiple: true
          path: reports

      - name: Send to ASPM Platform
        env:
          ASPM_WEBHOOK_URL: ${{ secrets.ASPM_WEBHOOK_URL }}
          ASPM_API_KEY: ${{ secrets.ASPM_API_KEY }}
          RESULT_SEMGREP: ${{ needs.semgrep.result }}
          RESULT_GITLEAKS: ${{ needs.secrets-scan.result }}
          RESULT_TRIVY: ${{ needs.dependency-scan.result }}
        run: python .github/scripts/aspm_scan.py

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, pipeline-scan, dependency-scan, sbom, container-scan, zap]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment final summary on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RESULT_SEMGREP: ${{ needs.semgrep.result }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
          RESULT_ZIZMOR: ${{ needs.pipeline-scan.result }}
          RESULT_SCA: ${{ needs.dependency-scan.result }}
          RESULT_SBOM: ${{ needs.sbom.result }}
          RESULT_CONTAINER: ${{ needs.container-scan.result }}
          RESULT_ZAP: ${{ needs.zap.result }}
        with:
          script: |
            const jobs = {
              'SAST (Semgrep)':         process.env.RESULT_SEMGREP,
              'Secrets (Gitleaks)':     process.env.RESULT_SECRETS,
              'Pipeline (Zizmor)':      process.env.RESULT_ZIZMOR,
              'Dependencies (Trivy SCA)': process.env.RESULT_SCA,
              'SBOM':                   process.env.RESULT_SBOM,
              'Container (Trivy Image)':  process.env.RESULT_CONTAINER,
              'DAST (OWASP ZAP)':       process.env.RESULT_ZAP,
            };

            const emoji = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${emoji(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            const allPassed = Object.values(jobs).every(r => r === 'success' || r === 'skipped');
            const header = allPassed
              ? '## ✅ Security Pipeline — Todos os checks passaram!'
              : '## ❌ Security Pipeline — Um ou mais checks falharam';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${header}\n\n| Status | Check | Resultado |\n|--------|-------|-----------|\n${rows}\n\n> Verifique os artefatos gerados para mais detalhes.`
            });