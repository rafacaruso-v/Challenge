name: Security Pipeline (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto \
            --exclude-rule generic.nginx.security.missing-internal.missing-internal \
            --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling \
            --error

      - name: Comment PR on SAST failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **SAST (Semgrep)** encontrou vulnerabilidades no código. Verifique o artefato gerado antes de fazer merge.'
            })

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif

      - name: Comment PR on secrets failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Secrets Scan (Gitleaks)** detectou possíveis credenciais ou segredos expostos no código. Revise antes de fazer merge.'
            })

  pipeline-scan:
    name: Pipeline CI/CD Security (Zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Zizmor
        run: pip install zizmor

      - name: Run Zizmor
        run: |
          zizmor --format sarif .github/workflows/security.yml > zizmor-results.sarif || true

      - name: Upload Zizmor Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zizmor-report
          path: zizmor-results.sarif

  dependency-scan:
    name: Dependency Scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload resultado como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-results
          path: trivy.sarif

      - name: Comment PR on dependency failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Dependency Scan (Trivy SCA)** encontrou dependências com vulnerabilidades HIGH ou CRITICAL. Atualize os pacotes antes de fazer merge.'
            })

  sbom:
    name: SBOM (Trivy CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.json

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, dependency-scan]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: docker build -t aspm-platform:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'aspm-platform:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-image-results
          path: trivy-image.sarif

      - name: Comment PR on container failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Container Scan (Trivy)** encontrou vulnerabilidades HIGH ou CRITICAL na imagem Docker. Corrija antes de fazer merge.'
            })

  zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, pipeline-scan, dependency-scan, sbom]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Start Streamlit App
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true &
          timeout 60s bash -c 'until curl -s http://localhost:8501; do sleep 5; done' || true

      - name: Start Nginx
        run: |
          docker run -d \
            --network host \
            -e STREAMLIT_HOST=localhost \
            -v ${{ github.workspace }}/proxy.conf:/etc/nginx/templates/default.conf.template:ro \
            --name nginx-proxy \
            nginx:alpine
          timeout 30s bash -c 'until curl -s http://localhost:80; do sleep 2; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:80"
          rules_file_name: ".zap/rules.tsv"
          issue_title: "Security Scan: OWASP ZAP Alerts Found"
          fail_action: true
          artifact_name: "zap-analysis-report"

      - name: Comment PR on DAST failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: failure() && github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**DAST (OWASP ZAP)** detectou vulnerabilidades na aplicação em execução. Verifique o relatório ZAP antes de fazer merge.'
            })

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, pipeline-scan, dependency-scan, sbom, container-scan, zap]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment final summary on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const jobs = {
              'SAST (Semgrep)':           '${{ needs.semgrep.result }}',
              'Secrets (Gitleaks)':       '${{ needs.secrets-scan.result }}',
              'Pipeline (Zizmor)':        '${{ needs.pipeline-scan.result }}',
              'Dependencies (Trivy SCA)': '${{ needs.dependency-scan.result }}',
              'SBOM':                     '${{ needs.sbom.result }}',
              'Container (Trivy Image)':  '${{ needs.container-scan.result }}',
              'DAST (OWASP ZAP)':         '${{ needs.zap.result }}',
            };

            const emoji = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${emoji(result)} | ${name} | \`${result}\` |`)
              .join('\n');

            const allPassed = Object.values(jobs).every(r => r === 'success' || r === 'skipped');
            const header = allPassed
              ? '## ✅ Security Pipeline — Todos os checks passaram!'
              : '## ❌ Security Pipeline — Um ou mais checks falharam';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${header}\n\n| Status | Check | Resultado |\n|--------|-------|-----------|\n${rows}\n\n> Verifique os artefatos gerados para mais detalhes.`
            });