name: Security Pipeline (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  secrets-scan:
    name: Deploy - Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif

  pipeline-scan:
    name: Deploy - Pipeline CI/CD (Zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zizmor
        run: pip install zizmor

      - name: Run Zizmor
        run: |
          zizmor --format sarif .github/workflows/security.yml > zizmor-results.sarif || true

      - name: Upload Zizmor Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zizmor-report
          path: zizmor-results.sarif

  dependency-scan:
    name: Dependency Scan (Trivy SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload resultado como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy.sarif

  sbom:
    name: Deploy - SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.json

  zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [semgrep, secrets-scan, pipeline-scan, dependency-scan, sbom]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Streamlit App
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true &
          timeout 60s bash -c 'until curl -s http://localhost:8501; do sleep 5; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:8501"
          issue_title: "Security Scan: OWASP ZAP Alerts Found"
          fail_action: false
          artifact_name: "zap-analysis-report"