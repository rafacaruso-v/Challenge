name: Security Pipeline (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  dependency-scan:
    name: Dependency Scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [semgrep, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Streamlit App
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true &
          timeout 60s bash -c 'until curl -s http://localhost:8501; do sleep 5; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:8501"
          issue_title: "Security Scan: OWASP ZAP Alerts Found"
          fail_action: false
          artifact_name: "zap-analysis-report"