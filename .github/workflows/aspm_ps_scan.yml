name: ASPM Security Scan (Merge to Main)

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  aspm-main-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Instalar Semgrep e dependencias Python
        run: |
          pip install semgrep google-genai requests --break-system-packages

      - name: Instalar Trivy (via repositorio APT com verificacao GPG)
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Instalar Gitleaks (binario oficial direto)
        run: |
          GITLEAKS_VERSION="8.30.1"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          
          curl -sSL "$URL" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Rodar scan e enviar para a ASPM Platform
        env:
          GEMINI_KEY_1: ${{ secrets.ASPM_GEMINI_KEY }}
          ASPM_WEBHOOK_URL: ${{ secrets.ASPM_WEBHOOK_URL }}
          ASPM_API_KEY: ${{ secrets.ASPM_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          cd .github/scripts
          python aspm_ps_scan.py