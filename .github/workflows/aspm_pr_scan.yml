name: ASPM Security Scan (Pull Request)

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write  

jobs:
  aspm-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias dos scanners
        run: |
          pip install semgrep checkov google-genai requests --break-system-packages
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Rodar scan e comentar no PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEY_1: ${{ secrets.ASPM_GEMINI_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/aspm_pr_scan.py