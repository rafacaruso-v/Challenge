services:

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap.sh -daemon -port 8090 -host 0.0.0.0 -config api.disablekey=true
    ports:
      - "8090:8090"
    networks:
      - aspm-network

  aspm:
    build: .
    expose:
      - "8501"
    environment:
      - GEMINI_KEY_1=${GEMINI_KEY_1}
      - GEMINI_KEY_2=${GEMINI_KEY_2}
      - GEMINI_KEY_3=${GEMINI_KEY_3}
      - GEMINI_KEY_4=${GEMINI_KEY_4}
      - ZAP_HOST=zap
    depends_on:
      - zap
    volumes:
      - ./aspm.db:/app/aspm.db
    networks:
      - aspm-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - STREAMLIT_HOST=aspm
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - aspm
    networks:
      - aspm-network

networks:
  aspm-network:
    driver: bridge