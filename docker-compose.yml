services:

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap.sh -daemon -port 8090 -host 0.0.0.0 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    networks:
      - aspm-network

  aspm:
    build: .
    expose:
      - "8501"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - ZAP_HOST=zap
    depends_on:
      - zap
    volumes:
      - ./aspm.db:/app/aspm.db
    networks:
      - aspm-network

  webhook:
    build: .
    command: uvicorn API.webhook:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    expose:
      - "8000"
    volumes:
      - ./aspm.db:/app/aspm.db
    depends_on:
      - aspm
    networks:
      - aspm-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "--url=zap-buffer-refurnish.ngrok-free.dev"
      - "webhook:8000"
    environment:
      - NGROK_AUTHTOKEN
    depends_on:
      - webhook
    networks:
      - aspm-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - STREAMLIT_HOST=aspm
    volumes:
      - ./proxy.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - aspm
    networks:
      - aspm-network

networks:
  aspm-network:
    driver: bridge