services:

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: zap.sh -daemon -port 8090 -host 0.0.0.0 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    networks:
      - aspm-network

  aspm:
    build: .
    expose:
      - "8501"
    environment:
      - GEMINI_KEY_1=${GEMINI_KEY_1}
      - GEMINI_KEY_2=${GEMINI_KEY_2}
      - GEMINI_KEY_3=${GEMINI_KEY_3}
      - GEMINI_KEY_4=${GEMINI_KEY_4}
      - ZAP_HOST=zap
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AWS_HUB_ACCESS_KEY_ID=${AWS_HUB_ACCESS_KEY}
      - AWS_HUB_SECRET_KEY=${AWS_HUB_SECRET_KEY}
      - AWS_TEST_REGION=${AWS_TEST_REGION}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - AWS_HUB_ACCOUNT_ID=${AWS_HUB_ACCOUNT_ID}
      - AWS_EXTERNAL_ID=${AWS_EXTERNAL_ID}
      - GEMINI_KEY_NPL=${GEMINI_KEY_NPL}
      - GEMINI_KEY_NPL_2=${GEMINI_KEY_NPL_2}
      - GEMINI_KEY_NPL_3=${GEMINI_KEY_NPL_3}
      - API_KEY=${API_KEY}
    depends_on:
      - zap
    volumes:
      - ./aspm.db:/app/aspm.db
    networks:
      - aspm-network

  webhook:
    build: .
    command: uvicorn API.webhook:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - ./aspm.db:/app/aspm.db
    depends_on:
      - aspm
    networks:
      - aspm-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "--url=zap-buffer-refurnish.ngrok-free.dev"
      - "webhook:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - webhook
    networks:
      - aspm-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - STREAMLIT_HOST=aspm
    volumes:
      - ./proxy.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - aspm
    networks:
      - aspm-network

networks:
  aspm-network:
    driver: bridge