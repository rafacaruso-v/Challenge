vulnerabilities:
  - id: "*"
    paths:
      - "usr/local/bin/gitleaks"
    statement: >
      Binario pre-compilado do Gitleaks (upstream). CVEs na stdlib/x-crypto/x-text
      do Go embutidas no binario; v8.30.1 e a versao mais recente disponivel e o
      projeto ja declarou foco apenas em patches de seguranca, sem previsao de
      rebuild com Go mais novo. Nao e codigo da aplicacao - risco aceito ate o
      upstream recompilar. Revisar a cada bump do Dependabot no ecosystem docker.

  - id: "CVE-2026-69244"
    statement: >
      Out-of-bounds heap read no parser C de resposta HTTP do aiohttp (< 3.14.3), disparado
      apenas quando o cliente recebe uma resposta chunked malformada de um servidor
      malicioso/comprometido. Impacto limitado a DoS (crash do processo cliente) - sem
      RCE, sem leak de dados, sem escalonamento de privilegio. Motivo da supressao: o aiohttp
      aqui e dependencia transitiva do Checkov (exigido como aiohttp<3.14.0,>=3.8.0 pelo
      checkov==3.3.9, a versao mais recente disponivel no momento). Nao ha combinacao de
      versoes publicada que resolva simultaneamente o CVE e a constraint do Checkov.
      Avaliacao de risco: projeto academico, aplicacao executada localmente, sem exposicao
      publica de rede e sem usuarios externos. O unico vetor de exploracao exigiria um
      servidor malicioso respondendo a requisicoes feitas pelo Checkov (ex: registries de
      modulos IaC) - cenario nao aplicavel aqui. Risco aceito.

  - id: "CVE-2026-0994"
    statement: >
      DoS via bypass de limite de recursão em google.protobuf.json_format.ParseDict() ao
      processar mensagens google.protobuf.Any aninhadas. Risco aceito: o pacote "protobuf"
      é dependência transitiva do SDK google-genai (usado para chamadas ao Gemini). Não há,
      no projeto, parsing direto de input não confiável via ParseDict(). Impacto seria apenas
      indisponibilidade (DoS), sem risco de vazamento de dados ou execução de código.
      Projeto acadêmico, sem exposição em produção real.

  - id: "CVE-2026-52869"
    statement: >
      Vulnerabilidades nos transportes de servidor (SSE, Streamable HTTP, WebSocket) do pacote
      "mcp" (Model Context Protocol SDK), versão 1.23.3, permitindo mistura de sessões entre
      clientes (injeção de mensagens, acesso/cancelamento de tarefas de outra sessão) e ausência
      de validação de Host/Origin. Risco aceito: o pacote "mcp" é dependência transitiva (não
      usamos nenhum transporte de servidor MCP - SSE/Streamable HTTP/WebSocket - ativamente no
      projeto). As vulnerabilidades só são exploráveis se um servidor MCP estiver de fato exposto
      e em execução, o que não é o caso aqui. Projeto acadêmico, sem exposição em produção real.

