server {
    listen 80;

    server_tokens off;

    location / {
        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "DENY"             always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "require-corp"     always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }

    location /_stcore/stream {
        internal;
        proxy_pass         http://${STREAMLIT_HOST}:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "DENY"             always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "require-corp"     always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }
}