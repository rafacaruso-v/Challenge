# Só propaga "Connection: upgrade" quando o client realmente pedir
# upgrade para "websocket". Qualquer outro valor (ex: "h2c") é tratado
# como conexão normal, evitando H2C smuggling.
map $http_upgrade $connection_upgrade {
    default "";
    "websocket" "upgrade";
}

server {
    listen 80;

    server_tokens off;

    # CSP completa, com todas as diretivas que não têm fallback em
    # default-src definidas explicitamente (object-src, base-uri,
    # form-action, frame-src), conforme recomendado pelo OWASP.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com http://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com http://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com http://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' ws://localhost wss://localhost; frame-ancestors 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self';";

    location / {
        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       $csp always;

        # Conteúdo dinâmico (HTML/estado do app): nunca deve ser
        # armazenado em cache, pode conter dados sensíveis por sessão.
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }

    # Assets estáticos (JS, CSS, imagens, fontes, mapas de origem).
    # Podem ser cacheados com segurança: não contêm dados de sessão e
    # o nome do arquivo já inclui hash/versão (cache busting do próprio
    # Streamlit), evitando servir conteúdo desatualizado.
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       $csp always;

        # Cache moderado e seguro: revalida sempre, mas permite ao
        # navegador reaproveitar o asset enquanto válido.
        add_header Cache-Control                 "public, max-age=3600, must-revalidate" always;
    }

    # Justificativa: esta location atende a conexão WebSocket do Streamlit
    # (_stcore/stream), que precisa ser acessada diretamente pelo navegador
    # do client. Marcá-la como "internal" bloqueia o handshake do WebSocket
    # e quebra a aplicação. O risco de SSRF é mitigado porque o proxy_pass
    # aponta para um host fixo (${STREAMLIT_HOST}) definido via variável de
    # ambiente do compose, não para um destino controlável pelo client.
    # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    location /_stcore/stream {
        proxy_pass         http://${STREAMLIT_HOST}:8501/_stcore/stream;
        proxy_http_version 1.1;

        # Upgrade restrito a websocket via map acima (mitiga H2C smuggling):
        # $connection_upgrade só vale "upgrade" quando $http_upgrade for
        # exatamente "websocket"; qualquer outro valor (ex: "h2c") resulta
        # em string vazia e a conexão não é promovida. O Semgrep ainda
        # sinaliza esta linha por padrão textual, mas a mitigação real já
        # está aplicada via map (falso positivo do scanner estático).
        proxy_set_header Upgrade    $http_upgrade;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets ficam abertos por mais tempo, timeout maior evita queda de conexão
        proxy_read_timeout     86400;
        proxy_connect_timeout  60;
        proxy_send_timeout     86400;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       $csp always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }
}