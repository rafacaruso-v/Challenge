server {
    listen 80;

    server_tokens off;

    location / {
        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "require-corp"     always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }

    location /_stcore/stream {
        proxy_pass         http://${STREAMLIT_HOST}:8501/_stcore/stream;
        proxy_http_version 1.1;

        # Headers necessários para upgrade de protocolo HTTP -> WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets ficam abertos por mais tempo, timeout maior evita queda de conexão
        proxy_read_timeout     86400;
        proxy_connect_timeout  60;
        proxy_send_timeout     86400;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "require-corp"     always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy       "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }
}