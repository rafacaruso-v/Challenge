map $http_upgrade $connection_upgrade {
    default "";
    "websocket" "upgrade";
}

map $scheme $ws_scheme {
    default "ws";
    https   "wss";
}

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;

server {
    listen 80;

    server_tokens off;
    client_max_body_size 50M;

    # Rejeicoes por rate limit retornam 429 (em vez do 503 padrao),
    # o que diferencia de uma falha real do upstream.
    limit_req_status 429;

    # IMPORTANTE: nao definir limit_req neste nivel. Ele seria herdado pelo
    # location de estaticos (limit_req so e herdado se o nivel atual nao tiver
    # nenhum proprio). O limite fica declarado apenas nos locations abaixo.

    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com http://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com http://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com http://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' $ws_scheme://$host; frame-ancestors 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self';";

    location / {
        limit_req zone=general_zone burst=100 nodelay;

        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy       $csp always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }


    # Estaticos do frontend: sem limit_req de proposito (o Streamlit dispara
    # dezenas de requisicoes de .js de uma vez no primeiro carregamento).
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        proxy_pass         http://${STREAMLIT_HOST}:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_send_timeout     60;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy       $csp always;
        # Sem "always": so adiciona em respostas 2xx/3xx, evitando que erros
        # (429/502/503) fiquem em cache no navegador por 1 hora.
        add_header Cache-Control                 "public, max-age=3600, must-revalidate";
    }


    location /_stcore/stream {
        limit_req zone=general_zone burst=50 nodelay;

        proxy_pass         http://${STREAMLIT_HOST}:8501/_stcore/stream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout     86400;
        proxy_connect_timeout  60;
        proxy_send_timeout     86400;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Server;

        add_header X-Content-Type-Options        "nosniff"          always;
        add_header X-Frame-Options               "SAMEORIGIN"       always;
        add_header Cross-Origin-Opener-Policy    "same-origin"      always;
        add_header Cross-Origin-Embedder-Policy  "credentialless"  always;
        add_header Cross-Origin-Resource-Policy  "same-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=()" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy       $csp always;
        add_header Cache-Control                 "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma                        "no-cache" always;
        add_header Expires                       "0" always;
    }
}